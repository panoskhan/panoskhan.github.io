name: Integrate Evidence OS on homepage

on:
  push:
    branches:
      - feat/3d-progressive-enhancement

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Evidence OS featured project
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          text = p.read_text(encoding="utf-8")
          marker = '<!-- EVIDENCE_OS_FEATURED_START -->'
          if marker in text:
              print("Evidence OS homepage block already present")
              raise SystemExit(0)
          anchor = '    <!-- ══════════════════════════════════════════════════ -->\n    <!--  6. FEATURED PROJECTS'
          if anchor not in text:
              raise SystemExit("Featured Projects anchor not found")
          block = '''    <!-- EVIDENCE_OS_FEATURED_START -->
    <section id="evidence-os" class="section container" aria-labelledby="evidence-os-heading">
      <div class="section-header reveal">
        <p class="kicker" data-lang="en">New Work · Evidence Infrastructure</p>
        <p class="kicker" data-lang="el">Νέο Έργο · Υποδομή Τεκμηρίωσης</p>
        <h2 id="evidence-os-heading" data-lang="en">Evidence OS</h2>
        <h2 data-lang="el">Evidence OS</h2>
        <p class="muted" data-lang="en">A practical evidence layer for research and public knowledge. Record claims, connect sources, assess evidence, and preserve transparent verification history.</p>
        <p class="muted" data-lang="el">Ένα πρακτικό επίπεδο τεκμηρίωσης για έρευνα και δημόσια γνώση. Καταγράψτε claims, συνδέστε πηγές, αξιολογήστε στοιχεία και διατηρήστε διαφανές ιστορικό επαλήθευσης.</p>
      </div>
      <div class="card reveal evidence-os-home-card">
        <div>
          <span class="tag cyan">Evidence · Provenance · Graph</span>
          <h3>Public product, evidence-first architecture.</h3>
          <p class="muted">Explore the workspace, relationship graph, verification methodology, and machine-readable registry.</p>
        </div>
        <div class="mt-16" style="display:flex;gap:10px;flex-wrap:wrap">
          <a class="btn btn-primary" href="/evidence-os/">Open Evidence OS</a>
          <a class="btn" href="/evidence-os/graph.html">Explore Evidence Graph</a>
          <a class="btn" href="/evidence-os/methodology.html">Read Methodology</a>
        </div>
      </div>
    </section>
    <!-- EVIDENCE_OS_FEATURED_END -->

'''
          text = text.replace(anchor, block + anchor, 1)
          p.write_text(text, encoding="utf-8")

      - name: Commit homepage integration
        run: |
          if git diff --quiet -- index.html; then
            echo "No homepage change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Feature Evidence OS on homepage"
          git push
