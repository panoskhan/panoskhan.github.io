<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Research Center | Panos Khan</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="any" />

  <meta name="description" content="Practical research frameworks on AI, governance, SEO, and digital architecture rendered from the unified platform registry." />
  <meta name="robots" content="index,follow,max-image-preview:large" />
  <link rel="canonical" href="https://panoskhan.github.io/research/" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Research Center | Panos Khan" />
  <meta property="og:description" content="Searchable, filterable research catalog linked to tools and capabilities." />
  <meta property="og:url" content="https://panoskhan.github.io/research/" />
  <meta property="og:image" content="https://panoskhan.github.io/assets/og-preview.svg" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preload" href="/assets/css/main.css" as="style" />
  <link rel="stylesheet" href="/assets/css/main.css" />
</head>
<body>
  <header class="site-header" role="banner" data-site-nav></header>
  <main class="container section">
    <nav class="breadcrumbs" aria-label="Breadcrumb">
      <a href="/">Home</a><span>/</span><span aria-current="page">Panos Khan Research</span>
    </nav>
    <header class="section-header section-header--start">
      <p class="kicker">Product C</p>
      <h1>Panos Khan Research</h1>
      <p class="lead">Evidence-led frameworks for better digital decisions, rendered from one shared registry for cross-product discovery.</p>
    </header>

    <nav class="product-subnav" aria-label="Research topics">
      <a href="/platform/">Dashboard</a>
      <a href="#catalog">Catalog</a>
      <a href="/ai/">AI</a>
      <a href="/capabilities/">Capabilities</a>
      <a href="/docs/">Docs</a>
    </nav>

    <section id="catalog" data-platform-catalog data-type="research" data-grid-id="researchCatalogGrid" data-search-id="researchCatalogSearch" data-filters-id="researchCatalogFilters" data-count-id="researchCatalogCount" data-empty-id="researchCatalogEmpty">
      <div class="catalog-head">
        <h2>Research catalog</h2>
        <p id="researchCatalogCount" class="muted">0 items</p>
      </div>
      <div class="ai-search-wrapper capability-search-wrap">
        <span class="ai-search-icon" aria-hidden="true">🔍</span>
        <input id="researchCatalogSearch" type="search" class="ai-search-input" placeholder="Search research by topic, tag, or domain..." aria-label="Search research" />
      </div>
      <div id="researchCatalogFilters" class="filter-bar mt-16" aria-label="Research domains"></div>
      <div id="researchCatalogGrid" class="content-grid mt-16" aria-live="polite"></div>
      <p id="researchCatalogEmpty" class="muted mt-16" hidden>No matching research entries found.</p>
    </section>
  </main>
  <footer class="site-footer" role="contentinfo" data-site-footer></footer>
  <script src="/assets/js/site.js"></script>
  <script src="/assets/js/platform.js"></script>
</body>
</html>
