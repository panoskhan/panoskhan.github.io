name: Validate site visual system

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "assets/css/**"
      - "assets/js/**"
      - ".github/workflows/unify-site-visual-system.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5

      - name: Verify homepage visual-system assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          required = [
              '/assets/css/home-cinematic-v2.css',
              '/assets/css/home-cinematic-v17.css',
              '/assets/css/v13-mobile-live.css',
              '/assets/css/home-mobile-color-motion.css',
              '/assets/js/home-cinematic-v2.js',
          ]
          missing = [item for item in required if item not in html or not Path(item.lstrip('/')).exists()]
          if missing:
              print('Missing homepage visual-system assets:')
              for item in missing:
                  print(item)
              raise SystemExit(1)
          print('Homepage visual-system wiring verified.')
          PY
