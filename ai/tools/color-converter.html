<body data-tool-id="color-converter">
  <div id="ai-tool-content">
    <form id="colorConverterForm">
      <div class="ai-form-group">
        <label for="colorInput">Color Input</label>
        <input id="colorInput" name="colorInput" type="text" required placeholder="#3498db or rgb(52,152,219) or hsl(204,70%,53%)" />
      </div>
      <div class="ai-form-group">
        <label for="backgroundColor">Background Color</label>
        <input id="backgroundColor" name="backgroundColor" type="text" value="#ffffff" placeholder="#ffffff" />
      </div>
      <div style="margin-top: 12px;">
        <button class="ai-btn ai-btn-primary" type="submit">Convert Color</button>
      </div>
    </form>
  </div>

  <script src="/assets/js/site.js"></script>
  <script src="/assets/js/ai-platform.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('colorConverterForm');
      if (!form) return;

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      function rgbToHex(r, g, b) {
        return `#${[r, g, b].map((v) => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('')}`;
      }

      function rgbToHsl(r, g, b) {
        r /= 255; g /= 255; b /= 255;
        const max = Math.max(r, g, b);
        const min = Math.min(r, g, b);
        let h;
        let s;
        const l = (max + min) / 2;
        const d = max - min;

        if (d === 0) {
          h = s = 0;
        } else {
          s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
          switch (max) {
            case r:
              h = ((g - b) / d) + (g < b ? 6 : 0);
              break;
            case g:
              h = ((b - r) / d) + 2;
              break;
            default:
              h = ((r - g) / d) + 4;
              break;
          }
          h /= 6;
        }

        return {
          h: Math.round(h * 360),
          s: Math.round(s * 100),
          l: Math.round(l * 100)
        };
      }

      function hslToRgb(h, s, l) {
        h = ((h % 360) + 360) % 360;
        s /= 100;
        l /= 100;

        if (s === 0) {
          const gray = Math.round(l * 255);
          return { r: gray, g: gray, b: gray };
        }

        const c = (1 - Math.abs(2 * l - 1)) * s;
        const x = c * (1 - Math.abs((h / 60) % 2 - 1));
        const m = l - c / 2;
        let r1 = 0, g1 = 0, b1 = 0;

        if (h < 60) {
          r1 = c; g1 = x;
        } else if (h < 120) {
          r1 = x; g1 = c;
        } else if (h < 180) {
          g1 = c; b1 = x;
        } else if (h < 240) {
          g1 = x; b1 = c;
        } else if (h < 300) {
          r1 = x; b1 = c;
        } else {
          r1 = c; b1 = x;
        }

        return {
          r: Math.round((r1 + m) * 255),
          g: Math.round((g1 + m) * 255),
          b: Math.round((b1 + m) * 255)
        };
      }

      function parseHex(value) {
        const match = value.trim().match(/^#?([\da-f]{3}|[\da-f]{6})$/i);
        if (!match) return null;
        let hex = match[1];
        if (hex.length === 3) {
          hex = hex.split('').map((char) => char + char).join('');
        }
        return {
          r: parseInt(hex.slice(0, 2), 16),
          g: parseInt(hex.slice(2, 4), 16),
          b: parseInt(hex.slice(4, 6), 16),
          a: 1
        };
      }

      function parseRgb(value) {
        const match = value.trim().match(/^rgba?\(([^)]+)\)$/i);
        if (!match) return null;
        const parts = match[1].split(',').map((part) => part.trim());
        if (parts.length < 3 || parts.length > 4) return null;
        const r = Number(parts[0]);
        const g = Number(parts[1]);
        const b = Number(parts[2]);
        const a = parts[3] !== undefined ? Number(parts[3]) : 1;
        if ([r, g, b, a].some((num) => Number.isNaN(num))) return null;
        return { r: clamp(r, 0, 255), g: clamp(g, 0, 255), b: clamp(b, 0, 255), a: clamp(a, 0, 1) };
      }

      function parseHsl(value) {
        const match = value.trim().match(/^hsla?\(([^)]+)\)$/i);
        if (!match) return null;
        const parts = match[1].split(',').map((part) => part.trim());
        if (parts.length < 3 || parts.length > 4) return null;
        const h = Number(parts[0]);
        const s = Number(parts[1].replace('%', ''));
        const l = Number(parts[2].replace('%', ''));
        const a = parts[3] !== undefined ? Number(parts[3]) : 1;
        if ([h, s, l, a].some((num) => Number.isNaN(num))) return null;
        const rgb = hslToRgb(h, clamp(s, 0, 100), clamp(l, 0, 100));
        return { ...rgb, a: clamp(a, 0, 1) };
      }

      function parseColor(value) {
        return parseHex(value) || parseRgb(value) || parseHsl(value);
      }

      function channelToLinear(channel) {
        const normalized = channel / 255;
        return normalized <= 0.03928 ? normalized / 12.92 : ((normalized + 0.055) / 1.055) ** 2.4;
      }

      function relativeLuminance(color) {
        return (0.2126 * channelToLinear(color.r)) + (0.7152 * channelToLinear(color.g)) + (0.0722 * channelToLinear(color.b));
      }

      function contrastRatio(foreground, background) {
        const l1 = relativeLuminance(foreground);
        const l2 = relativeLuminance(background);
        const lighter = Math.max(l1, l2);
        const darker = Math.min(l1, l2);
        return (lighter + 0.05) / (darker + 0.05);
      }

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const rawColor = form.elements.colorInput.value;
        const rawBackground = form.elements.backgroundColor.value || '#ffffff';
        const foreground = parseColor(rawColor);
        const background = parseColor(rawBackground);

        if (!foreground || !background) {
          AIPlatform.showFormattedOutput({
            title: AIPlatform.safeText('Color Converter'),
            sections: [
              { title: '1. Color Values', content: 'Unable to parse one or both color values. Supported formats: HEX, RGB(A), HSL(A).' },
              { title: '2. Color Preview', content: 'Preview unavailable.' },
              { title: '3. Contrast Analysis', content: 'Contrast analysis unavailable.' },
              { title: '4. CSS Variables', content: 'No CSS variables generated.' }
            ]
          });
          return;
        }

        const hex = rgbToHex(foreground.r, foreground.g, foreground.b);
        const hsl = rgbToHsl(foreground.r, foreground.g, foreground.b);
        const ratio = contrastRatio(foreground, background);
        const ratioText = ratio.toFixed(2);
        const previewHtml = `<div style="width:100%; max-width:280px; height:120px; border-radius:12px; border:1px solid rgba(255,255,255,0.12); background:${hex}; display:flex; align-items:center; justify-content:center; color:${ratio >= 4.5 ? '#111111' : '#ffffff'}; font-weight:700;">${hex}</div>`;
        const aaNormal = ratio >= 4.5 ? 'Pass' : 'Fail';
        const aaLarge = ratio >= 3 ? 'Pass' : 'Fail';
        const aaaNormal = ratio >= 7 ? 'Pass' : 'Fail';
        const aaaLarge = ratio >= 4.5 ? 'Pass' : 'Fail';

        AIPlatform.showFormattedOutput({
          title: AIPlatform.safeText('Color Converter'),
          sections: [
            {
              title: '1. Color Values',
              content: [
                `HEX: ${hex}`,
                `RGB: rgb(${Math.round(foreground.r)}, ${Math.round(foreground.g)}, ${Math.round(foreground.b)})`,
                `RGBA: rgba(${Math.round(foreground.r)}, ${Math.round(foreground.g)}, ${Math.round(foreground.b)}, ${foreground.a.toFixed(2)})`,
                `HSL: hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)`
              ].join('\n')
            },
            {
              title: '2. Color Preview',
              content: previewHtml
            },
            {
              title: '3. Contrast Analysis',
              content: [
                `Contrast ratio: ${ratioText}:1`,
                `AA normal text: ${aaNormal}`,
                `AA large text: ${aaLarge}`,
                `AAA normal text: ${aaaNormal}`,
                `AAA large text: ${aaaLarge}`
              ].join('\n')
            },
            {
              title: '4. CSS Variables',
              content: [
                `--color-primary: ${hex};`,
                `--color-primary-rgb: ${Math.round(foreground.r)} ${Math.round(foreground.g)} ${Math.round(foreground.b)};`,
                `--color-primary-hsl: ${hsl.h} ${hsl.s}% ${hsl.l}%;`,
                `--color-background: ${rgbToHex(background.r, background.g, background.b)};`
              ].join('\n')
            }
          ]
        });
      });
    });
  </script>
</body>
</html>
