name: Activate 3D Homepage
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  activate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach 3D loader to shared site runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/js/site.js')
          s=p.read_text(encoding='utf-8')
          marker='/* PK-3D-HOMEPAGE-ACTIVE */'
          if marker not in s:
              s += '\n' + marker + '\n(function(){var s=document.createElement("script");s.src="/assets/js/home-3d-loader.js";s.defer=true;document.head.appendChild(s);})();\n'
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit activation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/site.js
          git diff --cached --quiet || git commit -m 'Activate cinematic 3D homepage'
          git push
