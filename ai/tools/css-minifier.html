  <meta property="og:type" content="website" />
  <meta property="og:title" content="CSS Minifier | Panos Khan AI Platform" />
  <meta property="og:description" content="Minify CSS code by removing whitespace, comments, and unnecessary characters to reduce file size and improve frontend delivery speed today." />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebApplication",
        "@id": "https://panoskhan.github.io/ai/tools/css-minifier.html#webapp",
        "name": "CSS Minifier",
        "description": "Minify CSS code by removing whitespace, comments, and unnecessary characters to reduce file size and improve frontend delivery speed today.",
        "url": "https://panoskhan.github.io/ai/tools/css-minifier.html",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "All"
      }
    ]
  }
  </script>

  <link rel="preload" href="/assets/css/main.css" as="style" />
  <link rel="preload" href="/assets/css/ai-platform.css" as="style" />
  <link rel="stylesheet" href="/assets/css/main.css" />
  <link rel="stylesheet" href="/assets/css/ai-platform.css" />
</head>
<body data-tool-id="css-minifier">
  <div id="ai-tool-content">
    <form id="cssMinifierForm">
      <div class="ai-form-group">
        <label for="cssInput">CSS Input</label>
        <textarea id="cssInput" name="cssInput" rows="16" required placeholder="Paste CSS here" style="font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace;"></textarea>
      </div>
      <div style="margin-top: 12px;">
        <button class="ai-btn ai-btn-primary" type="submit">Minify CSS</button>
      </div>
    </form>
  </div>

  <script src="/assets/js/site.js"></script>
  <script src="/assets/js/ai-platform.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('cssMinifierForm');
      if (!form) return;

      function minifyCss(input) {
        return input
          .replace(/\/\*[\s\S]*?\*\//g, '')
          .replace(/\s+/g, ' ')
          .replace(/\s*([{}:;,>+~])\s*/g, '$1')
          .replace(/;}/g, '}')
          .trim();
      }

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const rawCss = form.elements.cssInput.value;
        const minified = minifyCss(rawCss);
        const originalBytes = new TextEncoder().encode(rawCss).length;
        const minifiedBytes = new TextEncoder().encode(minified).length;
        const savedBytes = Math.max(originalBytes - minifiedBytes, 0);
        const savings = originalBytes === 0 ? '0.00' : ((savedBytes / originalBytes) * 100).toFixed(2);

        AIPlatform.showFormattedOutput({
          title: AIPlatform.safeText('CSS Minifier'),
          sections: [
            {
              title: '1. Minified CSS',
              content: minified
            },
            {
              title: '2. Size Comparison',
              content: [
                `Original bytes: ${originalBytes}`,
                `Minified bytes: ${minifiedBytes}`,
                `Saved bytes: ${savedBytes}`,
                `Savings: ${savings}%`
              ].join('\n')
            },
            {
              title: '3. Optimization Notes',
              content: 'This browser-based minifier removes comments, collapses whitespace, and strips many optional spaces. For production pipelines, pair it with bundlers that also optimize selectors and merge duplicate rules.'
            }
          ]
        });
      });
    });
  </script>
</body>
</html>
