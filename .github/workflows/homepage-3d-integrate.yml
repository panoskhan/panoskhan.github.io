name: Integrate 3D Homepage

on:
  push:
    branches: [feat/3d-progressive-enhancement]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate 3D hero
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = '<link rel="stylesheet" href="/assets/css/home-3d-final.css" />'
          js = '<script src="/assets/js/home-3d-final.js" defer></script>'
          if css not in s:
              s=s.replace('<link rel="stylesheet" href="/assets/css/main.css" />', '<link rel="stylesheet" href="/assets/css/main.css" />\n  '+css)
          if '<!-- PK-3D-HERO -->' not in s:
              marker='        <div class="hero-visual" aria-hidden="true">'
              scene='''        <!-- PK-3D-HERO -->\n        <div class="home-3d-scene" aria-label="Panos Khan technology ecosystem visual">\n          <div class="home-3d-orbit"></div><div class="home-3d-orbit"></div><div class="home-3d-orbit"></div>\n          <div class="home-3d-core"><span class="home-3d-monogram">PK</span></div>\n          <div class="home-3d-label">Evidence · Research · Intelligence</div>\n          <div class="home-3d-node">Evidence OS</div>\n          <div class="home-3d-node">Research</div>\n          <div class="home-3d-node">Intelligence</div>\n          <div class="home-3d-node">Projects</div>\n          <div class="home-3d-copy"><strong>Building evidence-first technology.</strong><p>Explore the ecosystem and follow each project from idea to verifiable public work.</p></div>\n        </div>\n'''
              if marker in s:
                  s=s.replace(marker, scene+marker, 1)
          if js not in s:
              s=s.replace('</body>', '  '+js+'\n</body>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Integrate cinematic 3D hero into homepage'
          git push
