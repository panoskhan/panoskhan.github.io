name: Static quality checks

on:
  pull_request:
  push:
    branches: ["feat/3d-progressive-enhancement"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: python3 scripts/validate_static.py
