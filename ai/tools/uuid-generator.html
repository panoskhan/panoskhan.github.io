</head>
<body data-tool-id="uuid-generator">
  <div id="ai-tool-content">
    <form id="uuidForm">
      <div class="ai-form-group">
        <label for="quantity">Quantity</label>
        <select id="quantity" name="quantity">
          <option value="1">1</option>
          <option value="5">5</option>
          <option value="10">10</option>
          <option value="25">25</option>
          <option value="50">50</option>
          <option value="100">100</option>
        </select>
      </div>
      <div class="ai-form-group">
        <label for="format">Format</label>
        <select id="format" name="format">
          <option value="standard">Standard</option>
          <option value="uppercase">Uppercase</option>
          <option value="nodashes">No Dashes</option>
          <option value="braces">Braces</option>
        </select>
      </div>
      <div style="margin-top: 12px;">
        <button class="ai-btn ai-btn-primary" type="submit">Generate UUIDs</button>
      </div>
    </form>
  </div>

  <script src="/assets/js/site.js"></script>
  <script src="/assets/js/ai-platform.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('uuidForm');
      if (!form) return;

      function fallbackUuid() {
        var buf = new Uint8Array(16);
        window.crypto.getRandomValues(buf);
        buf[6] = (buf[6] & 0x0f) | 0x40;
        buf[8] = (buf[8] & 0x3f) | 0x80;
        var hex = Array.from(buf, function(b) { return b.toString(16).padStart(2, '0'); }).join('');
        return hex.slice(0,8) + '-' + hex.slice(8,12) + '-' + hex.slice(12,16) + '-' + hex.slice(16,20) + '-' + hex.slice(20);
      }

      function generateUuid() {
        if (window.crypto && typeof window.crypto.randomUUID === 'function') {
          return window.crypto.randomUUID();
        }
        return fallbackUuid();
      }

      function applyFormat(uuid, format) {
        if (format === 'uppercase') return uuid.toUpperCase();
        if (format === 'nodashes') return uuid.replace(/-/g, '');
        if (format === 'braces') return `{${uuid}}`;
        return uuid;
      }

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const quantity = Number(form.elements.quantity.value);
        const format = form.elements.format.value;
        const uuids = Array.from({ length: quantity }, () => applyFormat(generateUuid(), format));

        const outputData = {
          title: AIPlatform.safeText('UUID Generator'),
          sections: [
            {
              title: '1. Generated UUIDs',
              content: uuids.map((uuid, index) => `${index + 1}. ${uuid}`).join('\n')
            },
            {
              title: '2. UUID Format',
              content: 'These values are UUID v4 identifiers. Version 4 UUIDs use random data and follow the RFC 4122 layout with a fixed version nibble and variant bits.'
            },
            {
              title: '3. Copy All',
              content: uuids.join('\n')
            }
          ]
        };

        AIPlatform.showFormattedOutput(outputData);
      });
    });
  </script>
</body>
</html>
