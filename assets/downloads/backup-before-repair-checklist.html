      <p class="lead">Preserve data before laptop or phone repair work.</p>
    </header>
    <section class="card">
      <ul class="hub-roadmap" style="list-style:none;padding:0;margin:0">
      <li><label><input type="checkbox" /> List critical data locations (photos, documents, passwords, 2FA recovery codes).</label></li>
      <li><label><input type="checkbox" /> Copy user files to an external drive or trusted cloud account.</label></li>
      <li><label><input type="checkbox" /> Verify the backup opens on another device.</label></li>
      <li><label><input type="checkbox" /> Export browser passwords/bookmarks if needed.</label></li>
      <li><label><input type="checkbox" /> Note OS account credentials and device passcode.</label></li>
      <li><label><input type="checkbox" /> Remove or secure confidential local files before handing off hardware.</label></li>
      <li><label><input type="checkbox" /> Only then proceed with diagnostics or repair.</label></li>
      </ul>
